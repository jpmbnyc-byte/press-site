<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Critical: Base44 binds OAuth state.domain to Referer.
      Press origin (humanweather.press) is rejected with "Domain is not valid".
      Strip Referer so Base44 falls back to https://app.base44.com (allowed).
    -->
    <meta name="referrer" content="no-referrer" />
    <title>Continuing to Google…</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        background: #0e0d0a;
        color: #c4a84a;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }
      .spin {
        width: 2rem;
        height: 2rem;
        border: 2px solid #c4a84a;
        border-top-color: transparent;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      p {
        font-size: 10px;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        opacity: 0.8;
      }
      .err {
        color: #f0e9d8;
        max-width: 28rem;
        text-align: center;
        letter-spacing: 0.05em;
        text-transform: none;
        font-size: 14px;
        line-height: 1.5;
      }
      a.retry {
        color: #c4a84a;
        font-size: 12px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div class="spin" aria-hidden="true"></div>
    <p id="status">Continuing to Google…</p>
    <script>
      (function () {
        var DEFAULT_APP_ID = '6a57ce138c2f29923fec6bc4';
        var DEFAULT_NEXT = 'https://www.humanweather.press/account';
        var ALLOWED_HOSTS = {
          'www.humanweather.press': true,
          'humanweather.press': true,
          'humanweather.vercel.app': true,
          'humanweather.base44.app': true,
          localhost: true,
          '127.0.0.1': true,
        };

        function isSafeNext(value) {
          try {
            var url = new URL(value);
            if (url.protocol !== 'http:' && url.protocol !== 'https:') return false;
            if (ALLOWED_HOSTS[url.hostname]) return true;
            return url.hostname.slice(-11) === '.base44.app';
          } catch (e) {
            return false;
          }
        }

        function fail(msg) {
          var status = document.getElementById('status');
          status.className = 'err';
          status.textContent = msg;
          var a = document.createElement('a');
          a.className = 'retry';
          a.href = '/login';
          a.textContent = 'Back to log in';
          document.body.appendChild(a);
        }

        var params = new URLSearchParams(window.location.search);
        var next = params.get('next') || DEFAULT_NEXT;
        var appId = params.get('app_id') || DEFAULT_APP_ID;
        var popupOrigin = params.get('popup_origin') || '';

        if (!isSafeNext(next)) {
          fail('Invalid return URL.');
          return;
        }
        if (popupOrigin) {
          try {
            var po = new URL(popupOrigin);
            if (!ALLOWED_HOSTS[po.hostname] && po.hostname.slice(-11) !== '.base44.app') {
              fail('Invalid popup origin.');
              return;
            }
          } catch (e) {
            fail('Invalid popup origin.');
            return;
          }
        }

        // Hit app.base44.com directly (skip humanweather.base44.app → 307).
        // A redirect hop can re-attach Referer in some browsers and recreate Domain is not valid.
        var action = 'https://app.base44.com/api/apps/auth/login';

        var form = document.createElement('form');
        form.method = 'GET';
        form.action = action;
        form.setAttribute('referrerpolicy', 'no-referrer');
        form.referrerPolicy = 'no-referrer';

        function add(name, value) {
          var input = document.createElement('input');
          input.type = 'hidden';
          input.name = name;
          input.value = value;
          form.appendChild(input);
        }

        add('app_id', appId);
        add('from_url', next);
        if (popupOrigin) add('popup_origin', popupOrigin);

        document.body.appendChild(form);

        // Meta referrer is already no-referrer; brief delay helps some WebKit builds apply it.
        setTimeout(function () {
          try {
            form.submit();
          } catch (err) {
            // Last resort: noreferrer anchor
            var a = document.createElement('a');
            a.href =
              action +
              '?app_id=' +
              encodeURIComponent(appId) +
              '&from_url=' +
              encodeURIComponent(next) +
              (popupOrigin ? '&popup_origin=' + encodeURIComponent(popupOrigin) : '');
            a.rel = 'noreferrer noopener';
            a.referrerPolicy = 'no-referrer';
            document.body.appendChild(a);
            a.click();
          }
        }, 30);
      })();
    </script>
  </body>
</html>
